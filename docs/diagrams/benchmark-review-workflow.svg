<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="960" viewBox="0 0 1200 960" role="img" aria-labelledby="title description">
  <title id="title">Benchmark review and comparison workflow</title>
  <desc id="description">Start with saved benchmark answers, source excerpts, metadata, and available timing. Inspect automatic rules and manually judge factual correctness, citation support, and relevance. Edit the manual_review fields in results.json and rescore without new inference. Compare model runs only under matching test and execution conditions, with enough repetitions for useful timing estimates.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1200" height="960" rx="24" fill="#f8fafc"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="48" y="49" font-size="15" font-weight="700" letter-spacing="2" fill="#2563eb">LOCAL CHAT / REVIEW</text>
    <text x="48" y="99" font-size="38" font-weight="700" fill="#0f172a">Review before you rank models</text>
    <text x="48" y="135" font-size="20" fill="#475569">Automatic rules flag known errors. Review each answer against its excerpts.</text>

    <rect x="48" y="174" width="1104" height="108" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="72" y="215" font-size="27" font-weight="700" fill="#0f172a">1. Start with a finished benchmark run</text>
    <text x="72" y="253" font-size="20" fill="#475569">Answers + retrieved excerpts + model/configuration metadata + available timings</text>
    <g fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 600 282 V 310"/>
      <path d="M 312 336 V 310 H 888 V 336" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    </g>

    <rect x="48" y="338" width="528" height="226" rx="16" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="72" y="380" font-size="25" font-weight="700" fill="#1d4ed8">2A. Inspect automatic checks</text>
    <text x="72" y="418" font-size="20" fill="#334155">Reference patterns + retrieval evidence</text>
    <text x="72" y="449" font-size="20" fill="#334155">Source scope + citation numbers</text>
    <text x="72" y="480" font-size="20" fill="#334155">Headings + word count</text>
    <text x="72" y="511" font-size="20" fill="#334155">Execution + attack-context exposure</text>
    <text x="72" y="542" font-size="18" font-weight="600" fill="#1d4ed8">Rule passes are not factual approval.</text>

    <rect x="624" y="338" width="528" height="226" rx="16" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="2"/>
    <text x="648" y="380" font-size="25" font-weight="700" fill="#047857">2B. Review against the evidence</text>
    <text x="648" y="418" font-size="20" fill="#334155">Factual correctness</text>
    <text x="648" y="449" font-size="20" fill="#334155">Citation support + relevance</text>
    <text x="648" y="480" font-size="20" fill="#334155">Record judgments and reviewer notes.</text>
    <text x="648" y="511" font-family="Consolas, monospace" font-size="19" fill="#047857">results.json → manual_review</text>
    <text x="648" y="542" font-size="18" font-weight="600" fill="#047857">Use true / false; unreviewed fields stay null.</text>

    <g fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 312 564 V 595 H 888 V 564"/>
      <path d="M 600 595 V 630" marker-end="url(#arrow)"/>
    </g>

    <rect x="48" y="632" width="1104" height="122" rx="16" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="2"/>
    <text x="72" y="671" font-size="27" font-weight="700" fill="#5b21b6">3. Rescore saved results</text>
    <text x="72" y="707" font-family="Consolas, monospace" font-size="21" fill="#0f172a">--rescore .../results.json --output .../reviewed</text>
    <text x="72" y="737" font-size="19" fill="#475569">Preserve responses, timings, and judgments. Recompute the report without inference.</text>
    <path d="M 600 754 V 797" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="48" y="800" width="1104" height="104" rx="16" fill="#0f172a"/>
    <text x="72" y="840" font-size="27" font-weight="700" fill="#ffffff">4. Compare like-for-like runs</text>
    <text x="72" y="878" font-size="20" fill="#e2e8f0">Match cases, prompts, source content, generation options, and execution conditions.</text>
    <text x="48" y="940" font-size="19" fill="#475569">Collect repeated live runs for timing comparisons. A single sample is a smoke measurement.</text>
  </g>
</svg>
