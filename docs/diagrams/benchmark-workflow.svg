<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="910" viewBox="0 0 1200 910" role="img" aria-labelledby="title description">
  <title id="title">Local AI benchmark workflow</title>
  <desc id="description">Live runs collect responses, evidence, and timing from temporary Chroma and local Ollama. Saved trials reuse original questions and sources without new inference. Rescoring preserves existing measurements and review judgments. All three modes apply automatic checks and produce JSON and Markdown reports. Manual review remains separate.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1200" height="910" rx="24" fill="#f8fafc"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="48" y="49" font-size="15" font-weight="700" letter-spacing="2" fill="#2563eb">LOCAL CHAT / EVALUATION</text>
    <text x="48" y="99" font-size="38" font-weight="700" fill="#0f172a">Benchmark workflow</text>
    <text x="48" y="135" font-size="20" fill="#475569">Choose a run mode, apply the scoring rules, and inspect the evidence.</text>

    <rect x="48" y="174" width="344" height="176" rx="16" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
    <rect x="72" y="194" width="35" height="28" rx="7" fill="#2563eb"/>
    <text x="89.5" y="214" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">01</text>
    <text x="119" y="215" font-size="17" font-weight="700" letter-spacing="0.6" fill="#1d4ed8">LIVE RUN</text>
    <text x="72" y="257" font-family="Consolas, monospace" font-size="26" font-weight="700" fill="#0f172a">--live</text>
    <text x="72" y="293" font-size="19" fill="#334155">Temporary Chroma + local Ollama</text>
    <text x="72" y="323" font-size="19" fill="#334155">Responses + evidence + timings</text>

    <rect x="428" y="174" width="344" height="176" rx="16" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="2"/>
    <rect x="452" y="194" width="35" height="28" rx="7" fill="#047857"/>
    <text x="469.5" y="214" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">02</text>
    <text x="499" y="215" font-size="17" font-weight="700" letter-spacing="0.6" fill="#047857">SAVED TRIALS</text>
    <text x="452" y="257" font-family="Consolas, monospace" font-size="26" font-weight="700" fill="#0f172a">--saved-demo</text>
    <text x="452" y="293" font-size="19" fill="#334155">Original questions + sources</text>
    <text x="452" y="323" font-size="19" fill="#334155">No new model inference</text>

    <rect x="808" y="174" width="344" height="176" rx="16" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="2"/>
    <rect x="832" y="194" width="35" height="28" rx="7" fill="#7c3aed"/>
    <text x="849.5" y="214" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">03</text>
    <text x="879" y="215" font-size="17" font-weight="700" letter-spacing="0.6" fill="#6d28d9">RESCORE RESULTS</text>
    <text x="832" y="257" font-family="Consolas, monospace" font-size="26" font-weight="700" fill="#0f172a">--rescore</text>
    <text x="832" y="293" font-size="19" fill="#334155">Recompute checks + summaries</text>
    <text x="832" y="323" font-size="19" fill="#334155">Keep timings + review judgments</text>

    <g fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 220 350 V 385 H 980 V 350"/>
      <path d="M 600 350 V 418" marker-end="url(#arrow)"/>
    </g>

    <rect x="48" y="420" width="1104" height="132" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="72" y="460" font-size="27" font-weight="700" fill="#0f172a">Evaluate every attempt</text>
    <text x="72" y="496" font-size="20" fill="#334155">Reference patterns · retrieval evidence · source scope · citations · report format</text>
    <text x="72" y="527" font-size="19" fill="#475569">Timeouts, errors, and reported truncation remain failed attempts.</text>
    <path d="M 600 552 V 598" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="48" y="600" width="1104" height="148" rx="16" fill="#0f172a"/>
    <text x="72" y="640" font-size="27" font-weight="700" fill="#ffffff">Inspect and compare results</text>
    <path d="M 414 665 V 725 M 787 665 V 725" stroke="#475569" stroke-width="1.5"/>
    <text x="72" y="680" font-family="Consolas, monospace" font-size="23" font-weight="700" fill="#93c5fd">results.json</text>
    <text x="72" y="715" font-size="18" fill="#e2e8f0">Answers, excerpts + metadata</text>
    <text x="444" y="680" font-family="Consolas, monospace" font-size="23" font-weight="700" fill="#a7f3d0">report.md</text>
    <text x="444" y="715" font-size="18" fill="#e2e8f0">Scores, failures + timing tables</text>
    <text x="818" y="680" font-family="Consolas, monospace" font-size="23" font-weight="700" fill="#ddd6fe">progress.json</text>
    <text x="818" y="715" font-size="18" fill="#e2e8f0">Checkpoint after each live case</text>

    <rect x="48" y="784" width="1104" height="78" rx="12" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
    <text x="72" y="815" font-size="21" font-weight="700" fill="#9a3412">Automatic passes and manual review are separate.</text>
    <text x="72" y="844" font-size="19" fill="#7c2d12">Valid citation numbers do not prove claim support. Unrecorded timing stays N/A.</text>
    <text x="48" y="893" font-family="Consolas, monospace" font-size="16" fill="#64748b">Output: artifacts/benchmarks/&lt;UTC timestamp&gt;/</text>
  </g>
</svg>
